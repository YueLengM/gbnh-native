name: Build Windows native

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git

      - name: Configure
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Install bundle
        run: cmake --install build --prefix dist

      - name: Bundle MinGW runtime files
        run: |
          mkdir -p dist/native
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ -f "/ucrt64/bin/$dll" ]; then
              cp "/ucrt64/bin/$dll" dist/native/
            fi
          done
          echo "gbnh-native Windows x86_64 UCRT bundle" > dist/native/manifest.txt
          echo "mGBA: 0.10.5" >> dist/native/manifest.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbnh-native-windows-x86_64-ucrt
          path: dist/native
