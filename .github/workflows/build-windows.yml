name: Build Windows native

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pinned CMake with mise
        uses: jdx/mise-action@v3

      - name: Locate pinned CMake
        shell: pwsh
        run: |
          $cmakeRoot = (mise where cmake).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to locate CMake installed by mise' }
          $cmake = Join-Path $cmakeRoot 'bin/cmake.exe'
          if (-not (Test-Path -LiteralPath $cmake)) { throw "CMake executable not found: $cmake" }
          $version = & $cmake --version
          if ($LASTEXITCODE -ne 0 -or $version[0] -ne 'cmake version 3.31.12') {
            throw "Expected CMake 3.31.12, got: $version"
          }
          $version
          "GBNH_CMAKE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ninja
            git

      - name: Configure
        run: |
          cmake="$(cygpath -u "$GBNH_CMAKE")"
          "$cmake" --version
          "$cmake" -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          "$(cygpath -u "$GBNH_CMAKE")" --build build

      - name: Install bundle
        run: |
          "$(cygpath -u "$GBNH_CMAKE")" --install build --prefix dist

      - name: Bundle MinGW runtime files
        run: |
          mkdir -p dist/native
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ -f "/ucrt64/bin/$dll" ]; then
              cp "/ucrt64/bin/$dll" dist/native/
            fi
          done
          echo "gbnh-native Windows x86_64 UCRT bundle" > dist/native/manifest.txt
          echo "mGBA: 0.10.5" >> dist/native/manifest.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbnh-native-windows-x86_64-ucrt
          path: dist/native
